{% load chat_extras %}
<button class="icon-btn icon-btn--plain theme-toggle" type="button" data-theme-toggle
        aria-pressed="false" aria-label="Switch to dark mode" title="Switch theme">
  <span class="theme-toggle__icon theme-toggle__icon--sun">{% icon "sun" 18 %}</span>
  <span class="theme-toggle__icon theme-toggle__icon--moon">{% icon "moon" 18 %}</span>
</button>
